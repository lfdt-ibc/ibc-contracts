[profile.default]
src = "../../contracts/src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["../../contracts/lib"]
allow_paths = ["../.."]
auto_detect_solc = false
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
