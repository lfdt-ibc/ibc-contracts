[workspace]
members = [
    "crates/bls",
    "crates/consensus",
    "crates/crypto",
    "crates/ethereum-mpt",
    "crates/ibc-storage",
    "crates/public-values",
    "crates/program-logic",
    "crates/profile-constants",
    "crates/settlement",
    "crates/source-profile",
    "crates/ssz",
    "crates/types",
    "crates/zksync-native",
    "crates/zksync-rpc",
    "programs/trust-update",
    "programs/settlement-update",
    "programs/membership",
    "programs/non-membership",
]
exclude = ["tooling/proof-api"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
blake2 = { version = "=0.10.6", default-features = false }
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", rev = "9e4e2ae4780d3d69cecbec000f5e814df2392468", default-features = false, features = ["alloc", "experimental", "groups", "pairings"] }
hex = "=0.4.3"
serde = { version = "=1.0.228", default-features = false, features = ["alloc", "derive"] }
serde_json = "=1.0.145"
sha2 = { version = "=0.10.9", default-features = false }
sha3 = { version = "=0.10.8", default-features = false }
sp1-sdk = { version = "=6.7.0", features = ["blocking"] }
sp1-build = "=6.7.0"
sp1-zkvm = "=6.7.0"

# Route SHA-256 and Keccak through the zkVM precompiles while preserving the
# RustCrypto APIs used by the host build and the guest crates.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-6.2.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha3-0.10.8-sp1-6.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "allow"
too_many_lines = "allow"
