syntax = "proto3";

package ibc.v2.prover;

service ProverService {
  rpc LatestProvableHeight(LatestProvableHeightRequest) returns (LatestProvableHeightResponse) {}
  rpc StateProof(StateProofRequest) returns (StateProofResponse) {}
  rpc PacketProofs(PacketProofsRequest) returns (PacketProofsResponse) {}
  rpc TrustUpdateProof(TrustUpdateProofRequest) returns (StateProofResponse) {}
}

message Client {
  string chain_id = 1;
  string client_id = 2;
}

message LatestProvableHeightRequest { Client client = 1; }
message TrustUpdateProofRequest { Client client = 1; }
message LatestProvableHeightResponse { uint64 height = 1; uint64 timestamp = 2; }
message StateProofRequest { Client client = 1; uint64 height = 2; }
message StateProofResponse { bytes proof = 1; }

message PacketProofsRequest {
  Client client = 1;
  uint64 height = 2;
  ProofKind kind = 3;
  repeated Packet packets = 4;
}
message PacketProofsResponse { repeated bytes proofs = 1; }

enum ProofKind {
  PROOF_KIND_UNSPECIFIED = 0;
  PROOF_KIND_PACKET_COMMITMENT = 1;
  PROOF_KIND_ACKNOWLEDGEMENT = 2;
  PROOF_KIND_RECEIPT_ABSENCE = 3;
}

message Packet {
  uint64 sequence = 1;
  string source_client = 2;
  string destination_client = 3;
  uint64 timeout_timestamp = 4;
  repeated Payload payloads = 5;
}

message Payload {
  string source_port = 1;
  string destination_port = 2;
  string version = 3;
  string encoding = 4;
  bytes value = 5;
}
