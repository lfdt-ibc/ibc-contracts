[package]
name = "proof-api-linea-to-eth"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
alloy = { workspace = true, features = ["full"] }
anyhow = { workspace = true, features = ["std"] }
ethereum-apis = { workspace = true }
proof-api-core = { workspace = true, default-features = false }
proof-api-lib = { workspace = true, default-features = false }
ibc-eureka-solidity-types = { workspace = true, features = ["rpc"] }
reqwest = { workspace = true, features = ["json"] }
rlp = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tonic = { workspace = true, default-features = true }
tracing = { workspace = true, default-features = true }
